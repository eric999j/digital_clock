user_intent:
  raw_request: "回顧此專案並深入分析"
  inferred_acceptance:
    - "Review the current whole-project architecture and runtime contracts."
    - "Identify verified strengths, architectural pressure points, and runtime risks."
    - "Refresh source-anchored architecture artifacts without changing application code."
  cleanup_required: false
strategy: phased
runtime_reachable:
  - main.py
  - ui/main_window.py
  - core/clock_logic.py
  - services/
  - strategies/
  - core/
must_rewrite: []
copy_as_is:
  - main.py
  - core/
  - services/
  - strategies/
  - ui/
legacy_allowed_to_remain:
  - "All existing modules remain during the analysis-only phase."
defer_cleanup:
  - "Keep inferred seams advisory until a concrete refactoring target is approved."
  - "Extract additional feature controllers from ClockLogic only after preserving its public facade."
  - "Continue separating rendering and preference mutation from DigitalClock; rendering/presentation are already partially extracted."
  - "Retain the patch-on-latest settings merge while validating every mutation path uses the shared writer."
  - "Remove legacy pause booleans only after a versioned migration and runtime compatibility check."
full_rewrite_reason: null
implementation_rule: >
  This run is analysis-only. A later implementation plan must populate must_rewrite
  explicitly after selecting a refactoring candidate. No source_anchor in unit_graph.yaml
  is itself a rewrite target.
