      - {path: services/hourly_web_service.py, line: 27}
      - {path: strategies/hourly_web_strategy.py, line: 9}
      - {path: core/launch_rules.py, line: 19}
      - {path: core/program_launcher.py, line: 30}
      - {path: core/program_safety.py, line: 18}
      - {path: core/task_xml_importer.py, line: 137}
      - {path: ui/file_drop.py, line: 9}
    exported_signature:
      - {method: "HourlyWebService.update_config(url_rules, work_days_only=None) -> None", source_loc: "services/hourly_web_service.py:46", stability: must_preserve}
      - {method: "HourlyWebService.run_startup_rules(config=None) -> None", source_loc: "services/hourly_web_service.py:73", stability: must_preserve}
    dynamic_entrypoints:
      - {target: "program specified by launch rule", mechanism: convention, source_loc: "core/program_launcher.py:30"}
      - {target: "Windows Task Scheduler XML actions", mechanism: xml-config, source_loc: "core/task_xml_importer.py:137"}
