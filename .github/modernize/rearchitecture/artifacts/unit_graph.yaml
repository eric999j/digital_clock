units:
  - name: clock-shell
    trigger: cli
    trigger_detail: "python main.py; tkinter application startup, recurring tick, and shutdown"
    source_anchors:
      - {path: main.py, line: 31}
    exported_signature:
      - {method: "DigitalClock.run() -> None", source_loc: "ui/main_window.py:1900", stability: must_preserve}
      - {method: "ClockLogic.start() -> None", source_loc: "core/clock_logic.py:112", stability: must_preserve}
      - {method: "ClockLogic.on_close() -> None", source_loc: "core/clock_logic.py:419", stability: must_preserve}
    dynamic_entrypoints:
      - {target: "tkinter mainloop and WM_DELETE_WINDOW callback", mechanism: convention, source_loc: "ui/main_window.py:683"}
    depends_on: []
    shared_refs:
      - {module: clock-logic, used_fields: [start, check_reminders, on_close, notify_observers]}
      - {module: main-window, used_fields: [update_time, run, update]}
      - {module: config-manager, used_fields: [load_config, save_config]}
      - {module: events, used_fields: [SCREENSHOT_TRIGGERED]}
  - name: reminders
    trigger: page
    trigger_detail: "Context menu Reminder > add/edit/delete/pause; due reminder popup; snooze"
    source_anchors:
      - {path: ui/reminder_window.py, line: 11}
      - {path: ui/menus/reminder_menu.py, line: 27}
      - {path: services/reminder_service.py, line: 11}
      - {path: strategies/reminder_strategy.py, line: 7}
    exported_signature:
      - {method: "ReminderService.add_reminder(time_data, message, weekdays, original_reminder=None, title='') -> None", source_loc: "services/reminder_service.py:35", stability: must_preserve}
      - {method: "ReminderService.snooze_reminder(reminder, minutes, now=None) -> dict", source_loc: "services/reminder_service.py:92", stability: must_preserve}
    dynamic_entrypoints: []
    depends_on:
      - {unit: notifications, via: REMINDER_DUE observer event}
    shared_refs:
      - {module: clock-logic, used_fields: [add_reminder, delete_reminder, snooze_reminder]}
      - {module: config-manager, used_fields: [load_config, save_config]}
      - {module: pause-manager, used_fields: [get_pause_state]}
      - {module: events, used_fields: [REMINDER_DUE, REMINDER_ADDED]}
      - {module: popup-utils, used_fields: [show_reminder_popup_window, show_confirm_popup_window]}
  - name: hourly-launch
    trigger: page
    trigger_detail: "Context menu Hourly launch > configure/import/export/test; hourly or startup rules"
