unit: clock-shell
bindings:
  - {type: listener, name: "WM_DELETE_WINDOW -> ClockLogic.on_close", source_loc: "ui/main_window.py:683", target: "core.clock_logic.ClockLogic.on_close", must_appear_in_target: true, notes: "Flush pending settings before destroy."}
  - {type: listener, name: "tkinter after -> DigitalClock.update_time", source_loc: "ui/main_window.py:1900", target: "ui.main_window.DigitalClock.update_time", must_appear_in_target: true, notes: "Recurring render/logic scheduler."}
  - {type: listener, name: "pynput Listener -> screenshot callback", source_loc: "services/keyboard_service.py:68", target: "ClockLogic._on_screenshot_triggered", must_appear_in_target: true, notes: "Background-to-main-thread handoff."}
runtime_config:
  - {key: "system.save_delay_ms", source_loc: "core/clock_logic.py:134", source: code, default_value: "1000", must_appear_in_target: true, notes: "Debounced settings save delay."}
  - {key: "system.hide_duration_ms", source_loc: "ui/main_window.py:309", source: code, default_value: "2000", must_appear_in_target: true, notes: "Screenshot hiding duration."}
  - {key: "system.screenshot_keys", source_loc: "services/keyboard_service.py:40", source: code, default_value: "[win, shift, s]", must_appear_in_target: true, notes: "Combination keys."}
  - {key: "ui_behavior.animation.*", source_loc: "ui/main_window.py:44", source: code, default_value: "duration=300, fps=60, idle=250ms", must_appear_in_target: true, notes: "Refresh scheduler behavior."}
